<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>자기야, 선물 왔어 💜</title>
<meta property="og:title" content="자기야, 선물 왔어 💜">
<meta property="og:description" content="눌러서 열어봐!">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color:#3b2466;
  background:radial-gradient(circle at 50% 20%,#faf5ff 0,#ece0ff 60%,#dccbff 100%);
  overflow:hidden;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
main{position:relative;height:100vh;height:100dvh}
.scene{
  position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  padding:28px;text-align:center;
}
.scene.on{display:flex;animation:fade .6s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1{font-size:clamp(23px,6.6vw,32px);line-height:1.35;font-weight:800;word-break:keep-all}
.small{font-size:15px;color:#7a52c7;font-weight:700;word-break:keep-all}
.hint{font-size:15px;color:#8a76b3;min-height:22px}

/* 선물 상자 */
.box{
  position:relative;width:170px;height:150px;border:0;background:none;
  cursor:pointer;margin-top:30px;animation:wiggle 1.8s ease-in-out infinite;
}
.box .body{
  position:absolute;left:10px;right:10px;bottom:0;height:110px;border-radius:10px;
  background:#7c4ddb;color:#fff;font-size:30px;font-weight:800;letter-spacing:.05em;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 -12px 0 rgba(0,0,0,.08),0 14px 24px rgba(124,77,219,.3);
}
.box .lid{
  position:absolute;left:0;right:0;top:14px;height:36px;border-radius:10px;
  background:#9a6ff0;z-index:2;
  transition:transform .7s cubic-bezier(.3,1.4,.5,1),opacity .7s;
}
.box .lid::after{
  content:"💜";position:absolute;left:50%;top:-28px;
  transform:translateX(-50%);font-size:36px;
}
.box.open{animation:none}
.box.open .lid{transform:translate(60px,-140px) rotate(35deg);opacity:0}
@keyframes wiggle{
  0%,60%,100%{transform:rotate(0)}
  70%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}90%{transform:rotate(-3deg)}
}

/* 빼빼로 */
.sticks{position:relative;width:200px;height:155px}
.stick{
  position:absolute;left:50%;bottom:0;width:14px;height:145px;margin-left:-7px;
  border-radius:7px;transform-origin:50% 100%;transform:rotate(var(--r));
  background:linear-gradient(to bottom,var(--c) 0 70%,#e9b872 70% 100%);
  box-shadow:inset -3px 0 0 rgba(0,0,0,.12);
  animation:pop .7s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d);
}
@keyframes pop{
  from{transform:rotate(0) scaleY(0);opacity:0}
  to{transform:rotate(var(--r)) scaleY(1);opacity:1}
}

/* 버튼 */
.btns{display:flex;gap:14px;align-items:center;justify-content:center;min-height:64px}
button.b{
  border:0;border-radius:999px;padding:14px 26px;flex:none;
  font:inherit;font-size:18px;font-weight:800;cursor:pointer;
}
#yes{
  background:#8b5cf6;color:#fff;box-shadow:0 8px 0 #6a3fd1;
  transform:scale(var(--s,1));transition:transform .25s;
}
#no{
  position:relative;z-index:10;
  background:#fff;color:#8a76b3;box-shadow:0 6px 0 #d3c2f5;
  transition:transform .55s cubic-bezier(.22,1,.36,1);
}
#no .lb{display:inline-block}
#no.run .lb{animation:scurry .5s ease}
@keyframes scurry{
  0%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}
  60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}100%{transform:rotate(0)}
}
.ghost{
  position:fixed;z-index:9;border-radius:999px;background:#fff;color:#8a76b3;
  font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;
  pointer-events:none;animation:ghost .4s ease-out forwards;
}
@keyframes ghost{from{opacity:.5}to{opacity:0}}
.puff{
  position:fixed;font-size:26px;pointer-events:none;z-index:9;
  animation:puff .6s ease-out forwards;
}
@keyframes puff{
  from{opacity:1;transform:scale(.6)}
